<body>

  <div class="form-container">
    <div id="statusToast" class="toast"></div>

    <div class="form-header">
      <h2>Student Registration</h2>
      <p>Please fill in all mandatory fields to register</p>
    </div>


        <!-- 3. Roll Number -->
          <span class="error-msg" id="rollNumberError"></span>
        </div>

        <!-- 4. Date of Birth -->
          <span class="error-msg" id="dobError"></span>
        </div>

        <!-- 5. Gender -->
        <div class="form-group full-width">
          <label>Gender <span class="req">*</span></label>
          <div class="gender-options">
            <label class="gender-option">
              <input type="radio" name="gender" value="Female" /> Female
            </label>
            <label class="gender-option">
              <input type="radio" name="gender" value="Other" /> Other
            </label>
          </div>
          <span class="error-msg" id="genderError"></span>
        </div>

        <!-- 6. Email -->
        <div class="form-group full-width">
          <label for="email">Email Address <span class="req">*</span></label>
          <input type="email" id="email" placeholder="alex.rivera@example.com" />
          <span class="error-msg" id="emailError"></span>
        </div>

        <!-- 7. Password -->
        <div class="form-group">
          <label for="password">Password <span class="req">*</span></label>
          <input type="password" id="password" placeholder="At least 8 characters" />
          <span class="error-msg" id="passwordError"></span>
        </div>

        <!-- 8. Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password <span class="req">*</span></label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" />
          <span class="error-msg" id="confirmPasswordError"></span>
        </div>

        <!-- 9. Phone Number -->
        <div class="form-group">
          <label for="phone">Phone Number <span class="req">*</span></label>
          <input type="tel" id="phone" placeholder="10-digit number" maxlength="10" />
          <span class="error-msg" id="phoneError"></span>
        </div>

        <!-- 10. Alternate Phone Number -->
        <div class="form-group">
          <label for="altPhone">Alternate Phone Number</label>
          <input type="tel" id="altPhone" placeholder="10-digit number (optional)" maxlength="10" />
          <span class="error-msg" id="altPhoneError"></span>
        </div>
      </div>

      <button type="submit" class="btn-submit">Submit Registration</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("registrationForm");
    const toast = document.getElementById("statusToast");

    // Validation patterns
    const nameRegex = /^[A-Za-z\s]{2,30}$/;
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phoneRegex = /^[6-9]\d{9}$/;
    const rollRegex = /^[A-Za-z0-9_-]{3,20}$/;

    function setError(inputElement, errorElementId, message) {
      if (inputElement) inputElement.classList.add("invalid");
      document.getElementById(errorElementId).textContent = message;
    }

    function clearError(inputElement, errorElementId) {
      if (inputElement) inputElement.classList.remove("invalid");
      document.getElementById(errorElementId).textContent = "";
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      let isValid = true;

      // 1. First Name
      const firstName = document.getElementById("firstName");
      if (!firstName.value.trim()) {
        setError(firstName, "firstNameError", "First name is required");
        isValid = false;
      } else if (!nameRegex.test(firstName.value.trim())) {
        setError(firstName, "firstNameError", "Must contain only letters (min 2)");
        isValid = false;
      } else {
        clearError(firstName, "firstNameError");
      }

      // 2. Last Name
      const lastName = document.getElementById("lastName");
      if (!lastName.value.trim()) {
        setError(lastName, "lastNameError", "Last name is required");
        isValid = false;
      } else if (!nameRegex.test(lastName.value.trim())) {
        setError(lastName, "lastNameError", "Must contain only letters (min 2)");
        isValid = false;
      } else {
        clearError(lastName, "lastNameError");
      }

      // 3. Roll Number
      const rollNumber = document.getElementById("rollNumber");
      if (!rollNumber.value.trim()) {
        setError(rollNumber, "rollNumberError", "Roll number is required");
        isValid = false;
      } else if (!rollRegex.test(rollNumber.value.trim())) {
        setError(rollNumber, "rollNumberError", "Alphanumeric only (3-20 chars)");
        isValid = false;
      } else {
        clearError(rollNumber, "rollNumberError");
      }

      // 4. Date of Birth
      const dob = document.getElementById("dob");
      if (!dob.value) {
        setError(dob, "dobError", "Date of birth is required");
        isValid = false;
      } else {
        const selectedDate = new Date(dob.value);
        const today = new Date();
        if (selectedDate >= today) {
          setError(dob, "dobError", "DOB must be in the past");
          isValid = false;
        } else {
          clearError(dob, "dobError");
        }
      }

      // 5. Gender
      const selectedGender = document.querySelector('input[name="gender"]:checked');
      if (!selectedGender) {
        setError(null, "genderError", "Please select a gender");
        isValid = false;
      } else {
        clearError(null, "genderError");
      }

      // 6. Email
      const email = document.getElementById("email");
      if (!email.value.trim()) {
        setError(email, "emailError", "Email is required");
        isValid = false;
      } else if (!emailRegex.test(email.value.trim())) {
        setError(email, "emailError", "Enter a valid email address");
        isValid = false;
      } else {
        clearError(email, "emailError");
      }

      // 7. Password
      const password = document.getElementById("password");
      if (!password.value) {
        setError(password, "passwordError", "Password is required");
        isValid = false;
      } else if (password.value.length < 8) {
        setError(password, "passwordError", "Minimum 8 characters required");
        isValid = false;
      } else {
        clearError(password, "passwordError");
      }

      // 8. Confirm Password
      const confirmPassword = document.getElementById("confirmPassword");
      if (!confirmPassword.value) {
        setError(confirmPassword, "confirmPasswordError", "Please confirm password");
        isValid = false;
      } else if (confirmPassword.value !== password.value) {
        setError(confirmPassword, "confirmPasswordError", "Passwords do not match");
        isValid = false;
      } else {
        clearError(confirmPassword, "confirmPasswordError");
      }

      // 9. Phone Number
      const phone = document.getElementById("phone");
      if (!phone.value.trim()) {
        setError(phone, "phoneError", "Phone number is required");
        isValid = false;
      } else if (!phoneRegex.test(phone.value.trim())) {
        setError(phone, "phoneError", "Enter a valid 10-digit number");
        isValid = false;
      } else {
        clearError(phone, "phoneError");
      }

      // 10. Alternate Phone Number (Optional)
      const altPhone = document.getElementById("altPhone");
      if (altPhone.value.trim()) {
        if (!phoneRegex.test(altPhone.value.trim())) {
          setError(altPhone, "altPhoneError", "Enter a valid 10-digit number");
          isValid = false;
        } else if (altPhone.value.trim() === phone.value.trim()) {
          setError(altPhone, "altPhoneError", "Cannot match primary phone number");
          isValid = false;
        } else {
          clearError(altPhone, "altPhoneError");
        }
      } else {
        clearError(altPhone, "altPhoneError");
      }

      // Successful validation submission
      if (isValid) {
        toast.className = "toast success";
        toast.textContent = "Registration submitted successfully!";
        form.reset();
        
        setTimeout(() => {
          toast.className = "toast";
        }, 4000);
      }
    });

    // Real-time error removal on input focus/type
    document.querySelectorAll("input").forEach((element) => {
      element.addEventListener("input", function () {
        this.classList.remove("invalid");
        const errSpan = document.getElementById(`${this.id}Error`);
        if (errSpan) errSpan.textContent = "";
      });
    });
  </script>
